name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Minimal Build Files
        run: |
          mkdir -p app/src/main/res/values
          echo '<resources><string name="app_name">Prayer Appointments</string></resources>' > app/src/main/res/values/strings.xml
          echo 'include(":app")' > settings.gradle
          echo 'rootProject.name = "Prayer Appointment"' >> settings.gradle
          echo 'plugins { id("com.android.application") version "8.1.0" apply false }' > build.gradle
          echo 'plugins { id("com.android.application") }' > app/build.gradle
          echo 'android { namespace "com.example.prayerappointment"; compileSdk 34; defaultConfig { applicationId "com.example.prayerappointment"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0"; } }' >> app/build.gradle

      - name: Build APK (Debug)
        run: |
          chmod +x gradlew || true
          echo "Building APK..."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/
