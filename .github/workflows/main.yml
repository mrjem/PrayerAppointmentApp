name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Init Android Project
        run: |
          mkdir -p app/src/main/res/values app/src/main/java/com/example/prayerappointment
          
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Prayer Appointments</string>
          </resources>
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "PrayerAppointmentApp"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.1.0"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.example.prayerappointment'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.prayerappointment"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PrayerAppointment-APK
          path: app/build/outputs/apk/debug/
